<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JSON Parser and Stringify</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
            background: #f9f9f9;
            width: 400px;
        }

        textarea {
            width: 100%;
            height: 100px;
            margin: 10px 0;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
        }

        button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>JSON Parser and Stringify</h2>
    
    <textarea id="jsonInput" placeholder="Enter JSON or Object"></textarea>
    
    <button onclick="convertToJSON()">Stringify</button>
    <button onclick="parseJSON()">Parse</button>
    
    <h4>Result:</h4>
    <textarea id="jsonOutput" readonly></textarea>
</div>

<script src="./main.js"></script>

</body>
</html>
